name: Daily Equity Screener Auto-Update

on:
  schedule:
    - cron: '0 4 * * *'   # 9:30 AM IST
    - cron: '0 10 * * *'  # 3:30 PM IST
  workflow_dispatch:

jobs:
  update-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies (CPU PyTorch + FinBERT)
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install yfinance pandas numpy huggingface_hub transformers feedparser

      - name: Run Multi-Factor & FinBERT Screener
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python update_screener.py
